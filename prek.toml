# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  # docs/proever/ is the Ministry of Children and Education's exam archive,
  # under its own LICENSE (see CLAUDE.md "Licensing") and vendored verbatim —
  # the whitespace/EOF/line-ending fixers must not rewrite third-party
  # licensed content we do not own.
  { id = "trailing-whitespace", exclude = "^docs/proever/" },
  { id = "end-of-file-fixer", exclude = "^docs/proever/" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^docs/proever/" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "detect-private-key" },
  { id = "check-json", exclude = '^tsconfig\.json$' },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — see CONTRIBUTING.md "Commit Messages".
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]
