# Code quality gate: the repo's own prek hooks, run in CI.
#
# This is a documentation-only static site with no Node/JS toolchain (no
# package.json, no lockfile) — introducing one purely to run a formatter over
# incidental JSON is out of scope. The gate here is prek's builtin fixers
# (whitespace, EOF, line-endings, JSON/TOML/YAML validity, large files,
# merge-conflict markers, private keys) plus gitleaks, exactly mirroring the
# local `prek.toml` hooks.
name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      # `no-commit-to-branch` is a local-commit guard and is meaningless in
      # CI, where the checked-out ref legitimately is main.
      # Pinned to an exact tag: j178/prek-action publishes no floating major
      # tag, so `@v3` is unresolvable. Renovate keeps this current.
      - name: Run prek hooks
        uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files --hook-stage manual
        env:
          SKIP: no-commit-to-branch
